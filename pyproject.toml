[tool.poetry]
name = "emeris-timetable"
version = "0.1.0"
description = "Extract university timetable from pdf spreadsheet and add to Google Calendar"
authors = ["Tristan Brand <tristanbrand09@gmail.com>"]
readme = "README.md"
packages = [{ include = "emeris_timetable", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pandas = "^2.2.0"
tabula-py = "^2.9.0"
google-api-python-client = "^2.169.0"
google-auth-oauthlib = "^1.2.0"
camelot-py = { extras = ["cv"], version = "^1.0.9" }
python-dateutil = "^2.9.0.post0"
platformdirs = "^4.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[tool.poetry.scripts]
emeris-timetable = "emeris_timetable.main:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
